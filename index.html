<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
        }
        h1 {
            color: #2b6cb0;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            color: #4a5568;
        }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #2b6cb0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>👋 Hello World!</h1>
        <p>Your new portfolio root website is successfully live. This is a temporary placeholder to test your GitHub Pages deployment.</p>
        
        <!-- This link dynamically opens your DFA Editor relative to your domain -->
        <a href="./DFA_editor/" class="btn">Test DFA Editor Link 🚀</a>
    </div>

</body>
</html>
